<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Pedido Enviado</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      height: 100vh;
      position: relative;
    }

    /* Container do toast fixado no canto inferior direito */
    #toast {
      visibility: hidden;
      min-width: 250px;
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      border-radius: 8px;
      padding: 16px 24px;
      position: fixed;
      bottom: 30px;
      right: 30px;
      font-size: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      z-index: 1000;

      /* Animações */
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    /* Quando o toast estiver visível */
    #toast.show {
      visibility: visible;
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- Toast -->
  <div id="toast">✅ Pedido enviado com sucesso!</div>

  <script>
    // Função para mostrar o toast
    function showToast() {
      const toast = document.getElementById("toast");
      toast.classList.add("show");

      // Depois de 3 segundos, oculta o toast
      setTimeout(() => {
        toast.classList.remove("show");
      }, 3000);
    }

    // Simula que o pedido foi enviado e mostra o toast ao carregar a página
    window.onload = () => {
      showToast();
    };
  </script>

</body>
</html>
